name: Run Arbitrum Testnode
description: "Boot a snapshot-backed Arbitrum testnode in GitHub CI and export its config files"
inputs:
  version:
    required: false
    default: ""
    description: "Pinned release version; required unless image-ref is set"
  github-token:
    required: false
    description: "Token used for private GHCR authentication"
  image-repository:
    required: false
    default: "ghcr.io/offchainlabs/arbitrum-testnode-ci"
    description: "Container repository prefix used to resolve the testnode image"
  image-ref:
    required: false
    default: ""
    description: "Full image reference (incl. tag) to boot, bypassing variant/version resolution"
  l3-enabled:
    required: false
    default: "false"
    description: "Whether to boot the L3-enabled testnode"
  nitro-image:
    required: false
    default: ""
    description: "Nitro image to rebase the testnode image onto before booting (e.g. a locally built nitro-node-dev:latest)"
  timeboost-enabled:
    required: false
    default: "false"
    description: "Whether to enable Timeboost sequencer args and auctioneer/timeboost HTTP APIs"
  fee-token-decimals:
    required: false
    default: ""
    description: "Custom L3 fee-token decimals (6, 16, 18, or 20) when l3-enabled=true"
  nitro-contracts-version:
    description: "Nitro contracts version (e.g. v2.1, v3.2)"
    required: false
    default: "v3.2"
  output-dir:
    required: false
    default: ""
    description: "Directory where the exported config files should be written"
  container-name:
    required: false
    default: ""
    description: "Optional Docker container name override"
  startup-timeout-seconds:
    required: false
    default: "120"
    description: "Maximum time to wait for the testnode RPCs to become ready"
  network-config-path:
    required: false
    default: ""
    description: "Path(s) to overwrite with the exported localNetwork.json (comma-separated)"
outputs:
  base-image-ref:
    description: "Testnode image that was resolved (and pulled when remote); the rebase source when nitro-image is set"
    value: ${{ steps.resolve.outputs.base-image-ref }}
  image-ref:
    description: "Testnode image that was booted"
    value: ${{ steps.resolve.outputs.image-ref }}
  container-name:
    description: "Name of the booted testnode container"
    value: ${{ steps.resolve.outputs.container-name }}
  config-dir:
    description: "Directory containing the exported config files"
    value: ${{ steps.resolve.outputs.config-dir }}
  local-network-path:
    description: "Path to localNetwork.json"
    value: ${{ steps.resolve.outputs.local-network-path }}
  l1l2-network-path:
    description: "Path to l1l2_network.json"
    value: ${{ steps.resolve.outputs.l1l2-network-path }}
  l2l3-network-path:
    description: "Path to l2l3_network.json"
    value: ${{ steps.resolve.outputs.l2l3-network-path }}
  l1-bridge-ui-config-path:
    description: "Path to the L1/L2 bridge UI config"
    value: ${{ steps.resolve.outputs.l1-bridge-ui-config-path }}
  l2-bridge-ui-config-path:
    description: "Path to the L2/L3 bridge UI config"
    value: ${{ steps.resolve.outputs.l2-bridge-ui-config-path }}
  l1-rpc-url:
    description: "Host RPC URL for the L1"
    value: ${{ steps.resolve.outputs.l1-rpc-url }}
  l2-rpc-url:
    description: "Host RPC URL for the L2"
    value: ${{ steps.resolve.outputs.l2-rpc-url }}
  l3-rpc-url:
    description: "Host RPC URL for the L3"
    value: ${{ steps.resolve.outputs.l3-rpc-url }}
  variant:
    description: "Resolved variant name"
    value: ${{ steps.resolve.outputs.variant }}
  nitro-contracts-version:
    description: "Resolved nitro contracts version"
    value: ${{ steps.resolve.outputs.nitro-contracts-version }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_CONTAINER_NAME: ${{ inputs.container-name }}
        INPUT_FEE_TOKEN_DECIMALS: ${{ inputs.fee-token-decimals }}
        INPUT_IMAGE_REF: ${{ inputs.image-ref }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        INPUT_L3_ENABLED: ${{ inputs.l3-enabled }}
        INPUT_NITRO_CONTRACTS_VERSION: ${{ inputs.nitro-contracts-version }}
        INPUT_NITRO_IMAGE: ${{ inputs.nitro-image }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_TIMEBOOST_ENABLED: ${{ inputs.timeboost-enabled }}
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: node "${{ github.action_path }}/packages/action/src/resolve.mjs"

    # Registry behavior follows the base ref -- the image actually fetched. With
    # nitro-image set, the booted ref is a locally built rebase of that base.
    - name: Log in to GHCR
      if: ${{ startsWith(steps.resolve.outputs.base-image-ref, 'ghcr.io/') }}
      shell: bash
      run: |
        if [ -z "${{ inputs.github-token }}" ]; then
          echo "github-token is required for ghcr.io images" >&2
          exit 1
        fi
        echo "${{ inputs.github-token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Pull testnode image
      if: ${{ !startsWith(steps.resolve.outputs.base-image-ref, 'local/') }}
      shell: bash
      run: docker pull "${{ steps.resolve.outputs.base-image-ref }}"

    # Prunes stale rebased images before building, then builds. Consumes the
    # resolve step's refs so it cannot disagree with it about variant or image.
    - name: Rebase testnode image onto the supplied Nitro image
      if: ${{ steps.resolve.outputs.nitro-image != '' }}
      shell: bash
      env:
        BASE_IMAGE_REF: ${{ steps.resolve.outputs.base-image-ref }}
        IMAGE_REF: ${{ steps.resolve.outputs.image-ref }}
        NITRO_IMAGE: ${{ steps.resolve.outputs.nitro-image }}
      run: node "${{ github.action_path }}/packages/action/src/rebase.mjs"

    - name: Boot testnode image
      shell: bash
      env:
        INPUT_CONTAINER_NAME: ${{ inputs.container-name }}
        INPUT_FEE_TOKEN_DECIMALS: ${{ inputs.fee-token-decimals }}
        INPUT_IMAGE_REF: ${{ inputs.image-ref }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        INPUT_L3_ENABLED: ${{ inputs.l3-enabled }}
        INPUT_NITRO_CONTRACTS_VERSION: ${{ inputs.nitro-contracts-version }}
        INPUT_NITRO_IMAGE: ${{ inputs.nitro-image }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_NETWORK_CONFIG_PATH: ${{ inputs.network-config-path }}
        INPUT_STARTUP_TIMEOUT_SECONDS: ${{ inputs.startup-timeout-seconds }}
        INPUT_TIMEBOOST_ENABLED: ${{ inputs.timeboost-enabled }}
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: node "${{ github.action_path }}/packages/action/src/run.mjs"
