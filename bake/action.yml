name: Bake Custom Arbitrum Testnode Image
description: >-
  Boot a published Arbitrum testnode bundle, run a downstream setup command,
  and commit the customized state as a new image.
inputs:
  setup-command:
    required: true
    description: >-
      Shell command run against the booted bundle. Receives the testnode RPC,
      config, and deployment paths in its environment.
  image-ref:
    required: true
    description: "Full output image reference including tag"
  push:
    required: false
    default: "true"
    description: "Push the customized image"
  bundle-version:
    required: false
    default: "latest"
    description: "Published bundle version; defaults to the latest bundle"
  bundle-image-repository:
    required: false
    default: "ghcr.io/offchainlabs/arbitrum-litro"
    description: "Container repository hosting published bundles"
  bundle-image-ref:
    required: false
    default: ""
    description: "Explicit published bundle image override"
  l3-enabled:
    required: false
    default: "true"
    description: "Use the L3 ETH bundle"
  timeboost-enabled:
    required: false
    default: "false"
    description: "Use the L2 Timeboost bundle"
  fee-token-decimals:
    required: false
    default: ""
    description: "Custom L3 fee-token decimals (6, 16, 18, or 20)"
  startup-timeout-seconds:
    required: false
    default: "300"
    description: "Maximum time to wait for the published bundle to start"
  github-token:
    required: false
    default: ""
    description: "Token used to pull a private GHCR bundle"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Build the testnode CLI
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: |
        pnpm install --frozen-lockfile
        pnpm build

    - name: Log in to GHCR for the base bundle
      if: >-
        ${{ inputs.github-token != '' &&
            (startsWith(inputs.bundle-image-ref, 'ghcr.io/') ||
             (inputs.bundle-image-ref == '' && startsWith(inputs.bundle-image-repository, 'ghcr.io/'))) }}
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ inputs.github-token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Bake customized bundle
      shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        BASE_IMAGE_REF: ${{ inputs.bundle-image-ref }}
        BASE_IMAGE_REPOSITORY: ${{ inputs.bundle-image-repository }}
        BASE_IMAGE_VERSION: ${{ inputs.bundle-version }}
        FEE_TOKEN_DECIMALS: ${{ inputs.fee-token-decimals }}
        L3_ENABLED: ${{ inputs.l3-enabled }}
        OUTPUT_IMAGE_REF: ${{ inputs.image-ref }}
        PUSH_IMAGE: ${{ inputs.push }}
        SETUP_COMMAND: ${{ inputs.setup-command }}
        STARTUP_TIMEOUT_SECONDS: ${{ inputs.startup-timeout-seconds }}
        TIMEBOOST_ENABLED: ${{ inputs.timeboost-enabled }}
      run: |
        set -euo pipefail
        args=(
          --setup-command "$SETUP_COMMAND"
          --setup-working-directory "${{ github.workspace }}"
          --image-ref "$OUTPUT_IMAGE_REF"
          --image-repository "$BASE_IMAGE_REPOSITORY"
          --image-version "$BASE_IMAGE_VERSION"
          --startup-timeout-seconds "$STARTUP_TIMEOUT_SECONDS"
        )
        if [ -n "$BASE_IMAGE_REF" ]; then
          args+=(--base-image-ref "$BASE_IMAGE_REF")
        fi
        if [ -n "$FEE_TOKEN_DECIMALS" ]; then
          args+=(--fee-token-decimals "$FEE_TOKEN_DECIMALS")
        fi
        if [ "$L3_ENABLED" = "true" ]; then
          args+=(--l3-enabled)
        else
          args+=(--no-l3-enabled)
        fi
        if [ "$TIMEBOOST_ENABLED" = "true" ]; then
          args+=(--timeboost-enabled)
        fi
        if [ "$PUSH_IMAGE" = "true" ]; then
          args+=(--push)
        fi
        node apps/cli/dist/index.js bake "${args[@]}"
