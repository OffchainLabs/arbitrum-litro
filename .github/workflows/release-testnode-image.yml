name: Publish Testnode

# On a version tag (or manual dispatch), publish a testnode image for every
# current supported variant. Each image's chain state is
# GENERATED inline in CI by running `init` (no pre-built snapshot release
# bundles, nothing to publish out of band). The intended (variant x version)
# matrix and the init flags per combo come from runtime.mjs resolvePublishMatrix.
#
# Publishing lands in the public GHCR package, which is the only registry. Run
# Verify Published Image afterwards to boot what was published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (default: tag on push, else apps/cli package version)"
        required: false
        default: ""
        type: string
      variant:
        description: "Variant to publish (or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - l2
          - l2-timeboost
          - l3-eth
          - l3-custom-6
          - l3-custom-16
          - l3-custom-18
          - l3-custom-20

jobs:
  resolve-publish-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="v$(node -p "require('./apps/cli/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved image version: $V"
          # A tag that outruns apps/cli/package.json publishes images this
          # version of the CLI will never resolve: DEFAULT_START_IMAGE_VERSION
          # comes from that file, so `start` would keep defaulting to the older
          # tag. Use `pnpm release <version>` to move both together.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PKG="v$(node -p "require('./apps/cli/package.json').version")"
            if [ "$PKG" != "$V" ]; then
              echo "tag $V does not match apps/cli/package.json ($PKG)" >&2
              exit 1
            fi
          fi

      - name: Build publish matrix
        id: matrix
        env:
          # New releases are built from the current Nitro contracts family.
          VARIANT_FILTER: ${{ github.ref_type == 'tag' && 'all' || (github.event_name == 'workflow_dispatch' && inputs.variant || 'all') }}
        run: >-
          node --input-type=module -e
          "import { resolvePublishMatrix } from './packages/testnode/src/runtime.mjs';
          const include = resolvePublishMatrix(process.env.VARIANT_FILTER, 'v3.2');
          if (!include.length) throw new Error('empty publish matrix');
          console.error('publish matrix:', JSON.stringify(include));
          const { appendFileSync } = await import('node:fs');
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include }) + '\\n');"

  publish-testnode-image:
    needs: resolve-publish-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Each job runs a full init (4 docker containers + image builds). Cap
      # concurrency so a release fan-out stays under runner/concurrency limits
      # and avoids resource contention.
      max-parallel: 4
      matrix: ${{ fromJson(needs.resolve-publish-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      # Paths only; the contracts pins come from resolve-external-pins below.
      TOKEN_BRIDGE_LOCAL_DIR: ${{ github.workspace }}/../token-bridge-contracts
      NITRO_CONTRACTS_LOCAL_DIR: ${{ github.workspace }}/../nitro-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # From external-pins.ts, the module `init` resolves through, so the
      # checkout, the build context and the labels cannot name different commits.
      - name: Resolve external contracts pins
        run: pnpm exec tsx scripts/ci/resolve-external-pins.ts

      # Before the snapshot below, which takes tens of minutes: an unresolvable
      # ref should fail in a minute, not after the build.
      - name: Resolve image refs
        id: refs
        run: >-
          node scripts/ci/resolve-publish-refs.mjs
          --owner "${{ github.repository_owner }}"
          --version "${{ needs.resolve-publish-matrix.outputs.version }}"
          --variant "${{ matrix.variant }}"
          --contracts-version "${{ matrix.contractsVersion }}"

      - name: Install Foundry (forge for token-bridge build)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install yarn (classic)
        run: npm install -g yarn@1.22.22

      - name: Prepare token-bridge-contracts host checkout
        run: |
          set -euxo pipefail
          mkdir -p "$TOKEN_BRIDGE_LOCAL_DIR"
          cd "$TOKEN_BRIDGE_LOCAL_DIR"
          git init .
          git remote add origin "$TOKEN_BRIDGE_REPOSITORY"
          git fetch --depth 1 origin "$TOKEN_BRIDGE_COMMIT"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          yarn install --frozen-lockfile
          yarn build
          test -f node_modules/ts-node/dist/bin.js
          test -f scripts/deployment/deployTokenBridgeCreator.ts

      - name: Prepare Nitro contracts checkout
        run: |
          set -euxo pipefail
          mkdir -p "$NITRO_CONTRACTS_LOCAL_DIR"
          cd "$NITRO_CONTRACTS_LOCAL_DIR"
          git init .
          git remote add origin "$NITRO_CONTRACTS_REPOSITORY"
          git fetch --depth 1 origin "$NITRO_CONTRACTS_COMMIT"
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1
          test "$(node -p 'require("./package.json").name')" = "@arbitrum/nitro-contracts"
          test "$(node -p 'require("./package.json").version')" = "${NITRO_CONTRACTS_REF#v}"

      # Generate this combo's snapshot inline via init. init is flaky in CI
      # (intermittently exits 0 at wait-l1 before capturing, ~50%), so success
      # is driven off the manifest existing, with up to 3 attempts and a reset
      # between. --skip-post-capture-verify because the in-place verify-restart's
      # fixed 120s RPC budget is too tight for a cold runner.
      - name: Generate snapshot (init, retry until captured)
        env:
          SNAPSHOT_ID: ${{ matrix.snapshotId }}
          DECIMALS: ${{ matrix.feeTokenDecimals }}
          TIMEBOOST: ${{ matrix.timeboostEnabled }}
        run: |
          set -uo pipefail
          MANIFEST="config/snapshots/$SNAPSHOT_ID/manifest.json"
          ANVIL_STATE="config/snapshots/$SNAPSHOT_ID/anvil-state/state.json"
          EXTRA=""
          if [ -n "${DECIMALS:-}" ] && [ "${DECIMALS}" != "null" ]; then
            EXTRA="$EXTRA --fee-token-decimals $DECIMALS"
          fi
          if [ "${TIMEBOOST:-}" = "true" ]; then
            EXTRA="$EXTRA --timeboost-enabled"
          fi
          dump_init_diagnostics() {
            local attempt="$1"
            local exit_code="$2"
            echo "::group::init diagnostics attempt $attempt/$max ($SNAPSHOT_ID)"
            echo "init exit code: $exit_code"
            if [ -f config/state.json ]; then
              echo "config/state.json:"
              cat config/state.json
            else
              echo "config/state.json missing"
            fi
            if [ -f config/current-run.json ]; then
              echo "config/current-run.json:"
              cat config/current-run.json
              node --input-type=module - <<'NODE' || true
          import { existsSync, readFileSync } from "node:fs";
          const run = JSON.parse(readFileSync("config/current-run.json", "utf8"));
          for (const [label, path] of Object.entries({
            events: run.paths?.eventsFile,
            output: run.paths?.logFile,
          })) {
            if (!path || !existsSync(path)) {
              console.log(`${label} log missing: ${path ?? "(unset)"}`);
              continue;
            }
            const lines = readFileSync(path, "utf8").trimEnd().split("\n").slice(-80);
            console.log(`\nlast ${lines.length} ${label} log lines (${path}):`);
            console.log(lines.join("\n"));
          }
          NODE
            else
              echo "config/current-run.json missing"
            fi
            echo "snapshot files:"
            find "config/snapshots/$SNAPSHOT_ID" -maxdepth 4 -type f -print 2>/dev/null || true
            echo "docker compose ps:"
            docker compose -f docker/docker-compose.yaml -p arbitrum-testnode ps || true
            echo "docker compose logs tail:"
            docker compose -f docker/docker-compose.yaml -p arbitrum-testnode logs --tail=80 || true
            echo "::endgroup::"
          }
          max=3
          for attempt in $(seq 1 "$max"); do
            echo "::group::init attempt $attempt/$max ($SNAPSHOT_ID)"
            # shellcheck disable=SC2086
            # Bound each attempt so an unforeseen hang can't consume the whole
            # job; 1500s comfortably exceeds a healthy ~10-15min init and keeps
            # 3 attempts within timeout-minutes: 75. The retry loop resets with
            # `docker compose ... down -v` below so a timed-out attempt recovers.
            set +e
            timeout 1500 pnpm dev init \
              $EXTRA \
              --capture-id "$SNAPSHOT_ID" \
              --rebuild \
              --skip-post-capture-verify
            INIT_EXIT=$?
            set -e
            echo "::endgroup::"
            if [ -f "$MANIFEST" ] && [ -s "$ANVIL_STATE" ]; then
              echo "snapshot captured on attempt $attempt"
              break
            fi
            if [ -f "$MANIFEST" ]; then
              echo "attempt $attempt produced a manifest without non-empty Anvil state"
            fi
            dump_init_diagnostics "$attempt" "$INIT_EXIT"
            echo "attempt $attempt produced an incomplete snapshot; resetting and retrying"
            docker compose -f docker/docker-compose.yaml -p arbitrum-testnode down -v || true
          done
          test -f "$MANIFEST"
          test -s "$ANVIL_STATE"

      - name: Dump docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f docker/docker-compose.yaml -p arbitrum-testnode logs --tail=100 || true

      - name: Prepare testnode context
        run: >-
          node scripts/ci/prepare-testnode-context.mjs
          --variant "${{ matrix.variant }}"
          --snapshot-id "${{ matrix.snapshotId }}"

      # The arm64 job bakes this context rather than regenerating it: snapshot
      # state is architecture-neutral, so a second `init` would only risk the two
      # images under one tag disagreeing about deployed contract addresses.
      #
      # Tarred because the context is thousands of small files, and kept outside
      # the repo because there is no .dockerignore to exclude it from the build.
      - name: Archive testnode context
        run: tar -cf "$RUNNER_TEMP/testnode-context.tar" .testnode-context

      - name: Upload testnode context for the arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: testnode-context-${{ matrix.variant }}-${{ matrix.contractsVersion }}
          path: ${{ runner.temp }}/testnode-context.tar
          if-no-files-found: error
          retention-days: 1

      # Supplies the container driver the gha cache below needs; the default
      # docker driver cannot export one.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push testnode image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            tokenbridge=${{ env.TOKEN_BRIDGE_DOCKER_CONTEXT }}
          file: docker/testnode.Dockerfile
          build-args: |
            BUNDLE_VERSION=${{ needs.resolve-publish-matrix.outputs.version }}
            BUNDLE_VARIANT=${{ matrix.variant }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            NITRO_CONTRACTS_REF=${{ env.NITRO_CONTRACTS_REF }}
            NITRO_CONTRACTS_COMMIT=${{ env.NITRO_CONTRACTS_COMMIT }}
            TOKENBRIDGE_REF=${{ env.TOKEN_BRIDGE_REF }}
            TOKENBRIDGE_COMMIT=${{ env.TOKEN_BRIDGE_COMMIT }}
          push: true
          tags: ${{ steps.refs.outputs.tag }}
          # Scoped by architecture and nothing else: rows share the identical
          # token-bridge-contracts stage, but its output holds an arch-specific
          # `node`, so unscoped the two architectures evict each other.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # Merges linux/arm64 into each tag the job above published, making it a
  # multi-arch index that Docker resolves natively on Apple Silicon.
  #
  # Native runner rather than `platforms:` above: the token-bridge-contracts
  # stage runs a full yarn+forge build whose `node` binary the image copies out,
  # so it is per-architecture, and under QEMU it exceeds the job budget.
  #
  # No Foundry, yarn or token-bridge checkout here -- those serve `init`, which
  # does not run in this job.
  publish-testnode-image-arm64:
    needs: [resolve-publish-matrix, publish-testnode-image]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.resolve-publish-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same source as the amd64 job, so one tag's two halves cannot be built
      # against different contracts.
      - name: Resolve external contracts pins
        run: pnpm exec tsx scripts/ci/resolve-external-pins.ts

      # Same helper as the amd64 job, so the two architectures of one row cannot
      # land under different tags.
      - name: Resolve image refs
        id: refs
        run: >-
          node scripts/ci/resolve-publish-refs.mjs
          --owner "${{ github.repository_owner }}"
          --version "${{ needs.resolve-publish-matrix.outputs.version }}"
          --variant "${{ matrix.variant }}"
          --contracts-version "${{ matrix.contractsVersion }}"

      - name: Download testnode context
        uses: actions/download-artifact@v4
        with:
          name: testnode-context-${{ matrix.variant }}-${{ matrix.contractsVersion }}

      # The Dockerfile COPYs from `.testnode-context`, a path relative to the
      # build context, so it has to land in the repo root.
      - name: Restore testnode context
        run: |
          set -euo pipefail
          tar -xf testnode-context.tar
          test -f .testnode-context/metadata.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must mirror the amd64 job: a build arg naming an undefined env expands to
      # empty, silently unlabelling this half of the tag.
      - name: Build and push arm64 testnode image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            tokenbridge=${{ env.TOKEN_BRIDGE_DOCKER_CONTEXT }}
          file: docker/testnode.Dockerfile
          platforms: linux/arm64
          build-args: |
            BUNDLE_VERSION=${{ needs.resolve-publish-matrix.outputs.version }}
            BUNDLE_VARIANT=${{ matrix.variant }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            NITRO_CONTRACTS_REF=${{ env.NITRO_CONTRACTS_REF }}
            NITRO_CONTRACTS_COMMIT=${{ env.NITRO_CONTRACTS_COMMIT }}
            TOKENBRIDGE_REF=${{ env.TOKEN_BRIDGE_REF }}
            TOKENBRIDGE_COMMIT=${{ env.TOKEN_BRIDGE_COMMIT }}
          # By digest, not a tag: an `-arm64` tag would leave a pinnable half of
          # a release in the package listing. The merge below names it.
          outputs: type=image,name=${{ steps.refs.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # `imagetools create`, not the crane copy the alias step uses: re-wrapping
      # a source in a fresh index is the point here, not a hazard.
      #
      # The tag is its own source, folding in the amd64 manifest behind it, so a
      # re-run is idempotent.
      - name: Merge arm64 into the published tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ steps.refs.outputs.repository }}
          TAG: ${{ steps.refs.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "merging $DIGEST into $TAG"
          docker buildx imagetools create --tag "$TAG" "$TAG" "${REPOSITORY}@${DIGEST}"
          node scripts/ci/assert-image-platforms.mjs --image-ref "$TAG"

  # Moves `latest-<variant>` onto this release. Waits on the arm64 merge: crane
  # copies the digest a tag holds when it runs, so aliasing earlier would pin the
  # alias to the amd64-only manifest the tag briefly holds.
  publish-latest-bundle:
    if: ${{ github.ref_type == 'tag' }}
    needs: [resolve-publish-matrix, publish-testnode-image, publish-testnode-image-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crane
        env:
          CRANE_VERSION: v0.21.9
        run: |
          set -euo pipefail
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o /tmp/crane.tar.gz
          tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest bundle aliases
        env:
          MATRIX: ${{ needs.resolve-publish-matrix.outputs.matrix }}
          VERSION: ${{ needs.resolve-publish-matrix.outputs.version }}
        run: >-
          node scripts/ci/publish-latest-aliases.mjs
          --owner "${{ github.repository_owner }}"
