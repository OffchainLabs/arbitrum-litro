name: Publish Testnode

# On a version tag (or manual dispatch), publish a testnode image for every
# variant x nitro-contracts-version we support. Each image's chain state is
# GENERATED inline in CI by running `init` (no pre-built snapshot release
# bundles, nothing to publish out of band). The intended (variant x version)
# matrix and the init flags per combo come from runtime.mjs resolvePublishMatrix.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (default: tag on push, else apps/cli package version)"
        required: false
        default: ""
        type: string
      variant:
        description: "Variant to publish (or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - l2
          - l2-timeboost
          - l3-eth
          - l3-custom-6
          - l3-custom-16
          - l3-custom-18
          - l3-custom-20
      nitro-contracts-version:
        description: "Nitro contracts version (or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - v2.1
          - v3.2
      dockerhub-repository:
        description: "Docker Hub repository to publish to (retarget for a dry run)"
        required: false
        default: "offchainlabs/arbitrum-litro"
        type: string
      overwrite:
        description: "Replace Docker Hub tags that already exist"
        required: false
        default: false
        type: boolean

jobs:
  resolve-publish-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="v$(node -p "require('./apps/cli/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved image version: $V"
          # A tag that outruns apps/cli/package.json publishes images this
          # version of the CLI will never resolve: DEFAULT_START_IMAGE_VERSION
          # comes from that file, so `start` would keep defaulting to the older
          # tag. Use `pnpm release <version>` to move both together.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PKG="v$(node -p "require('./apps/cli/package.json').version")"
            if [ "$PKG" != "$V" ]; then
              echo "tag $V does not match apps/cli/package.json ($PKG)" >&2
              exit 1
            fi
          fi

      - name: Build publish matrix
        id: matrix
        env:
          # On tag push: every variant x every supported version. On dispatch:
          # the chosen filters. resolvePublishMatrix only emits supported combos
          # (e.g. no v2.1 for L2-only variants).
          VARIANT_FILTER: ${{ github.ref_type == 'tag' && 'all' || (github.event_name == 'workflow_dispatch' && inputs.variant || 'all') }}
          VERSION_FILTER: ${{ github.ref_type == 'tag' && 'all' || (github.event_name == 'workflow_dispatch' && inputs.nitro-contracts-version || 'all') }}
        run: >-
          node --input-type=module -e
          "import { resolvePublishMatrix } from './packages/testnode/src/runtime.mjs';
          const include = resolvePublishMatrix(process.env.VARIANT_FILTER, process.env.VERSION_FILTER);
          if (!include.length) throw new Error('empty publish matrix');
          console.error('publish matrix:', JSON.stringify(include));
          const { appendFileSync } = await import('node:fs');
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include }) + '\\n');"

  publish-testnode-image:
    needs: resolve-publish-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Each job runs a full init (4 docker containers + image builds). Cap
      # concurrency so a release fan-out stays under runner/concurrency limits
      # and avoids resource contention.
      max-parallel: 4
      matrix: ${{ fromJson(needs.resolve-publish-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      # init resolves token-bridge-contracts to <repo-parent>/token-bridge-contracts;
      # pin the location and the commit the contract-deployer Dockerfiles use.
      TOKEN_BRIDGE_LOCAL_DIR: ${{ github.workspace }}/../token-bridge-contracts
      TOKEN_BRIDGE_COMMIT: 5975d8f7360816341be7f94fd333ef240f4aec23
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry (forge for token-bridge build)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install yarn (classic)
        run: npm install -g yarn@1.22.22

      - name: Prepare token-bridge-contracts host checkout
        run: |
          set -euxo pipefail
          mkdir -p "$TOKEN_BRIDGE_LOCAL_DIR"
          cd "$TOKEN_BRIDGE_LOCAL_DIR"
          git init .
          git remote add origin https://github.com/OffchainLabs/token-bridge-contracts.git
          git fetch --depth 1 origin "$TOKEN_BRIDGE_COMMIT"
          git checkout --detach FETCH_HEAD
          yarn install --frozen-lockfile
          yarn build
          test -f node_modules/ts-node/dist/bin.js
          test -f scripts/deployment/deployTokenBridgeCreator.ts

      # Generate this combo's snapshot inline via init. init is flaky in CI
      # (intermittently exits 0 at wait-l1 before capturing, ~50%), so success
      # is driven off the manifest existing, with up to 3 attempts and a reset
      # between. --skip-post-capture-verify because the in-place verify-restart's
      # fixed 120s RPC budget is too tight for a cold runner.
      - name: Generate snapshot (init, retry until captured)
        env:
          SNAPSHOT_ID: ${{ matrix.snapshotId }}
          NC_VERSION: ${{ matrix.contractsVersion }}
          DECIMALS: ${{ matrix.feeTokenDecimals }}
          TIMEBOOST: ${{ matrix.timeboostEnabled }}
        run: |
          set -uo pipefail
          MANIFEST="config/snapshots/$SNAPSHOT_ID/manifest.json"
          ANVIL_STATE="config/snapshots/$SNAPSHOT_ID/anvil-state/state.json"
          EXTRA=""
          if [ -n "${DECIMALS:-}" ] && [ "${DECIMALS}" != "null" ]; then
            EXTRA="$EXTRA --fee-token-decimals $DECIMALS"
          fi
          if [ "${TIMEBOOST:-}" = "true" ]; then
            EXTRA="$EXTRA --timeboost-enabled"
          fi
          dump_init_diagnostics() {
            local attempt="$1"
            local exit_code="$2"
            echo "::group::init diagnostics attempt $attempt/$max ($SNAPSHOT_ID)"
            echo "init exit code: $exit_code"
            if [ -f config/state.json ]; then
              echo "config/state.json:"
              cat config/state.json
            else
              echo "config/state.json missing"
            fi
            if [ -f config/current-run.json ]; then
              echo "config/current-run.json:"
              cat config/current-run.json
              node --input-type=module - <<'NODE' || true
          import { existsSync, readFileSync } from "node:fs";
          const run = JSON.parse(readFileSync("config/current-run.json", "utf8"));
          for (const [label, path] of Object.entries({
            events: run.paths?.eventsFile,
            output: run.paths?.logFile,
          })) {
            if (!path || !existsSync(path)) {
              console.log(`${label} log missing: ${path ?? "(unset)"}`);
              continue;
            }
            const lines = readFileSync(path, "utf8").trimEnd().split("\n").slice(-80);
            console.log(`\nlast ${lines.length} ${label} log lines (${path}):`);
            console.log(lines.join("\n"));
          }
          NODE
            else
              echo "config/current-run.json missing"
            fi
            echo "snapshot files:"
            find "config/snapshots/$SNAPSHOT_ID" -maxdepth 4 -type f -print 2>/dev/null || true
            echo "docker compose ps:"
            docker compose -f docker/docker-compose.yaml -p arbitrum-testnode ps || true
            echo "docker compose logs tail:"
            docker compose -f docker/docker-compose.yaml -p arbitrum-testnode logs --tail=80 || true
            echo "::endgroup::"
          }
          max=3
          for attempt in $(seq 1 "$max"); do
            echo "::group::init attempt $attempt/$max ($SNAPSHOT_ID)"
            # shellcheck disable=SC2086
            # Bound each attempt so an unforeseen hang can't consume the whole
            # job; 1500s comfortably exceeds a healthy ~10-15min init and keeps
            # 3 attempts within timeout-minutes: 75. The retry loop resets with
            # `docker compose ... down -v` below so a timed-out attempt recovers.
            set +e
            timeout 1500 pnpm dev init \
              --nitro-contracts-version "$NC_VERSION" \
              $EXTRA \
              --capture-id "$SNAPSHOT_ID" \
              --rebuild \
              --skip-post-capture-verify
            INIT_EXIT=$?
            set -e
            echo "::endgroup::"
            if [ -f "$MANIFEST" ] && [ -s "$ANVIL_STATE" ]; then
              echo "snapshot captured on attempt $attempt"
              break
            fi
            if [ -f "$MANIFEST" ]; then
              echo "attempt $attempt produced a manifest without non-empty Anvil state"
            fi
            dump_init_diagnostics "$attempt" "$INIT_EXIT"
            echo "attempt $attempt produced an incomplete snapshot; resetting and retrying"
            docker compose -f docker/docker-compose.yaml -p arbitrum-testnode down -v || true
          done
          test -f "$MANIFEST"
          test -s "$ANVIL_STATE"

      - name: Dump docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f docker/docker-compose.yaml -p arbitrum-testnode logs --tail=100 || true

      - name: Prepare testnode context
        run: >-
          node scripts/ci/prepare-testnode-context.mjs
          --variant "${{ matrix.variant }}"
          --snapshot-id "${{ matrix.snapshotId }}"
          --nitro-contracts-version "${{ matrix.contractsVersion }}"

      # Both refs are derived from one suffix so the registries cannot disagree
      # about what a version means. The suffix shape must match
      # buildTestnodeImageRef in packages/testnode/src/runtime.mjs -- that is
      # what consumers resolve, so a drift here publishes tags nothing pulls.
      #
      # The GHCR image is `arbitrum-litro`, matching Docker Hub and this repo.
      # GHCR has no rename, so this is a new package rather than a renamed one:
      # everything up to v0.2.10 stays in `arbitrum-testnode-ci`, which keeps
      # serving consumers pinned to a pre-rename action ref.
      - name: Resolve image refs
        id: refs
        env:
          CONTRACTS_VERSION: ${{ matrix.contractsVersion }}
          # Empty on tag pushes (dispatch inputs do not exist there), so a
          # release always lands in the real repository.
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-repository || 'offchainlabs/arbitrum-litro' }}
          OWNER: ${{ github.repository_owner }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.resolve-publish-matrix.outputs.version }}
        run: |
          set -euo pipefail
          suffix="${VERSION}-nc${CONTRACTS_VERSION#v}-${VARIANT}"
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "ghcr=ghcr.io/${owner}/arbitrum-litro:${suffix}"
            echo "dockerhub=${DOCKERHUB_REPOSITORY}:${suffix}"
          } >> "$GITHUB_OUTPUT"
          echo "publishing ${suffix} to ghcr.io/${owner}/arbitrum-litro and ${DOCKERHUB_REPOSITORY}"

      # Docker Hub tags are mutable and public: without this, a re-run silently
      # replaces a shipped image. Queried through the Hub API rather than the
      # registry because Docker Hub answers 401 for an unknown repository, which
      # is indistinguishable from bad credentials. Assumes a public repository
      # (a private one 404s whether or not the tag exists).
      - name: Refuse to overwrite a published Docker Hub tag
        if: ${{ !inputs.overwrite }}
        env:
          REF: ${{ steps.refs.outputs.dockerhub }}
        run: |
          set -euo pipefail
          repository="${REF%:*}"
          tag="${REF##*:}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${repository}/tags/${tag}")"
          case "$status" in
            404)
              echo "$REF is free"
              ;;
            200)
              echo "$REF already exists; re-run with overwrite=true to replace it" >&2
              exit 1
              ;;
            *)
              echo "could not determine whether $REF exists (HTTP $status)" >&2
              exit 1
              ;;
          esac

      # Supplies the container driver the gha cache below needs; the default
      # docker driver cannot export one.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release must not degrade to GHCR-only when the credential is missing:
      # half-published versions are worse than a failed run.
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required to publish" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push testnode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/testnode.Dockerfile
          push: true
          # One build, two pushes -- a second build could diverge from the first.
          tags: |
            ${{ steps.refs.outputs.ghcr }}
            ${{ steps.refs.outputs.dockerhub }}
          # Unscoped on purpose: the token-bridge-contracts stage is identical
          # across matrix rows (same pinned ref), so sharing one scope is where
          # the saving is. Rows overwrite each other's entry; reads still hit.
          cache-from: type=gha
          cache-to: type=gha,mode=max
