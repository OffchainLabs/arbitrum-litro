name: Mirror Images to Docker Hub

# Copies published GHCR tags to Docker Hub without rebuilding. A rebuild is not
# equivalent: the Dockerfile fetches token-bridge-contracts and apt packages at
# build time, so it lands a different digest than the tag it replaces.
#
# The tag list is read from the source registry, not derived from
# resolvePublishMatrix: that function describes what a release publishes now, so
# using it would silently omit tags an older release published under rules since
# changed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to mirror (e.g. v0.2.10)"
        required: true
        type: string
      variant:
        description: "Variant to mirror (or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - l2
          - l2-timeboost
          - l3-eth
          - l3-custom-6
          - l3-custom-16
          - l3-custom-18
          - l3-custom-20
      nitro-contracts-version:
        description: "Nitro contracts version (or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - v2.1
          - v3.2
      source-repository:
        description: "GHCR repository to copy from"
        required: false
        default: "ghcr.io/offchainlabs/arbitrum-testnode-ci"
        type: string
      dockerhub-repository:
        description: "Docker Hub repository to mirror into"
        required: false
        default: "offchainlabs/arbitrum-litro"
        type: string
      overwrite:
        description: "Replace destination tags whose digest differs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: mirror-to-dockerhub-${{ inputs.dockerhub-repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # crane reads the same ~/.docker/config.json the login steps below write,
      # so no separate credential wiring. Pinned rather than :latest so a mirror
      # is reproducible.
      - name: Install crane
        env:
          CRANE_VERSION: v0.21.9
        run: |
          set -euo pipefail
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o /tmp/crane.tar.gz
          tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
          crane version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly rather than mirroring nothing.
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required to mirror" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Inputs arrive as env, never interpolated into a script body.
      - name: Resolve tags
        id: tags
        env:
          CONTRACTS_VERSION: ${{ inputs.nitro-contracts-version }}
          SRC_REPOSITORY: ${{ inputs.source-repository }}
          VARIANT: ${{ inputs.variant }}
          VERSION: ${{ inputs.version }}
        run: >-
          node scripts/ci/resolve-mirror-tags.mjs
          --repository "$SRC_REPOSITORY"
          --version "$VERSION"
          --variant "$VARIANT"
          --contracts-version "$CONTRACTS_VERSION"

      - name: Mirror tags
        env:
          DST_REPOSITORY: ${{ inputs.dockerhub-repository }}
          SRC_REPOSITORY: ${{ inputs.source-repository }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: >-
          node scripts/ci/mirror-tags.mjs
          --source "$SRC_REPOSITORY"
          --destination "$DST_REPOSITORY"
          ${{ inputs.overwrite && '--overwrite' || '' }}
