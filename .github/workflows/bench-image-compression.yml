name: Bench testnode boot

# Throwaway: compares pull + boot time of image variants through the action.
# Lives only on the bench/zstd branch.
on:
  push:
    branches: [bench/zstd]

env:
  SOURCE: ghcr.io/offchainlabs/arbitrum-litro
  BENCH: ghcr.io/offchainlabs/arbitrum-litro-bench
  ZSTD: compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix:
        variant: [l2, l3-eth]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch entrypoint to wait for L2 instead of sleeping
        run: |
          set -euo pipefail
          src="${SOURCE}:latest-${{ matrix.variant }}"
          docker pull -q "$src" >/dev/null
          cid="$(docker create "$src")"
          docker cp "$cid:/usr/local/bin/arbitrum-testnode" bench/arbitrum-testnode
          docker rm "$cid" >/dev/null
          grep -q '^	sleep 10$' bench/arbitrum-testnode
          python3 - bench/arbitrum-testnode <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          wait = ("\tuntil curl -sf -X POST -H 'Content-Type: application/json' "
                  "-d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' "
                  "http://127.0.0.1:8547 >/dev/null; do sleep 0.2; done\n")
          s = s.replace("\tsleep 10\n", wait, 1)
          open(p, "w").write(s)
          EOF
          grep -n -B1 -A1 "until curl" bench/arbitrum-testnode
          labels="$(docker inspect --format '{{json .Config.Labels}}' "$src" | jq -r 'to_entries[] | "\(.key)=\(.value)"')"
          { echo "labels<<EOF"; echo "$labels"; echo "EOF"; } >> "$GITHUB_ENV"
      - name: zstd + nowait
        uses: docker/build-push-action@v6
        with:
          context: bench
          file: bench/nowait.Dockerfile
          build-args: SRC=${{ env.SOURCE }}:latest-${{ matrix.variant }}
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.BENCH }}:nowait-${{ matrix.variant }},push=true,${{ env.ZSTD }}
      - name: zstd + nowait + slim
        uses: docker/build-push-action@v6
        with:
          context: bench
          file: bench/slim.Dockerfile
          build-args: SRC=${{ env.BENCH }}:nowait-${{ matrix.variant }}
          labels: ${{ env.labels }}
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.BENCH }}:slim-${{ matrix.variant }},push=true,${{ env.ZSTD }}
      - name: Sizes
        run: |
          set -euo pipefail
          for ref in "${SOURCE}:latest-${{ matrix.variant }}" "${BENCH}:zstd-${{ matrix.variant }}" "${BENCH}:nowait-${{ matrix.variant }}" "${BENCH}:slim-${{ matrix.variant }}"; do
            m="$(docker buildx imagetools inspect --raw "$ref")"
            if echo "$m" | jq -e '.manifests' >/dev/null; then
              d="$(echo "$m" | jq -r '[.manifests[] | select(.platform.architecture=="amd64")][0].digest')"
              m="$(docker buildx imagetools inspect --raw "${ref%:*}@$d")"
            fi
            echo "size $ref layers=$(echo "$m" | jq '.layers|length') bytes=$(echo "$m" | jq '[.layers[].size]|add')"
          done

  startgap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [slim-l3-eth, zstd-l3-eth]
        trial: [1, 2]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Time create and start separately
        run: |
          set -eu
          ref="${BENCH}:${{ matrix.image }}"
          docker info --format 'driver={{.Driver}} store={{json .DriverStatus}}'
          now() { date +%s.%N; }
          d() { awk -v a="$1" -v b="$2" 'BEGIN{printf "%.2f", b-a}'; }
          t0=$(now); docker pull -q "$ref" >/dev/null; t1=$(now)
          echo "pull $(d $t0 $t1)s"
          for i in 1 2 3; do
            t0=$(now); cid=$(docker create -e TESTNODE_VARIANT=l3-eth -p 127.0.0.1:8545:8545 -p 127.0.0.1:8547:8547 -p 127.0.0.1:8548:8548 -p 127.0.0.1:8080:8080 -p 127.0.0.1:3347:8549 -p 127.0.0.1:3348:8550 "$ref"); t1=$(now)
            docker start "$cid" >/dev/null; t2=$(now)
            until curl -sf -m 1 -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:3347 >/dev/null; do sleep 0.1; done; t3=$(now)
            echo "run $i: create $(d $t0 $t1)s start $(d $t1 $t2)s start->L3 $(d $t2 $t3)s"
            docker rm -f "$cid" >/dev/null
          done
          t0=$(now); docker run --rm --entrypoint true "$ref"; t1=$(now)
          echo "run --rm true: $(d $t0 $t1)s"

  boot:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [l2, l3-eth]
        image: [slim]
        poll: ['1', '0.2']
        trial: [1, 2, 3]
    name: boot (${{ matrix.variant }}, poll-${{ matrix.poll }}, ${{ matrix.trial }})
    env:
      BENCH_POLL_SECONDS: ${{ matrix.poll }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ matrix.image }}" = gzip ]; then
            echo "ref=${SOURCE}:latest-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${BENCH}:${{ matrix.image }}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Boot through the action
        id: action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-ref: ${{ steps.ref.outputs.ref }}
          l3-enabled: ${{ matrix.variant == 'l3-eth' }}
      - name: Soak and validate
        env:
          CONTAINER: ${{ steps.action.outputs.container-name }}
          L1_RPC_URL: ${{ steps.action.outputs.l1-rpc-url }}
          L2_RPC_URL: ${{ steps.action.outputs.l2-rpc-url }}
          L3_RPC_URL: ${{ steps.action.outputs.l3-rpc-url }}
        run: |
          set -euo pipefail
          sleep 20
          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" = true
          curl -sf http://127.0.0.1:8080/health | jq -e '.healthy'
          for url in "$L1_RPC_URL" "$L2_RPC_URL" ${L3_RPC_URL:+"$L3_RPC_URL"}; do
            curl -sfS -X POST -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$url"; echo
          done
          docker exec "$CONTAINER" ps -eo comm 2>/dev/null | sort | uniq -c || docker top "$CONTAINER"
          docker inspect --format 'started={{.State.StartedAt}}' "$CONTAINER"
          echo '--- container log (timestamped)'
          docker logs -t "$CONTAINER" 2>&1 | grep -E 'variant:|anvil ready|waiting|wait done|starting L3|HTTP server started|WebSocket enabled|ERROR|error' | head -60
